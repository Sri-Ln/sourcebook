name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if the Save button simply did not appear on a LinkedIn
        page, that is most likely **selector rot** — LinkedIn changed their
        markup. Please use the "Extraction broke" template instead, since it
        needs different information.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a LinkedIn profile
        2. Click Save
        3. ...
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen
      options:
        - In-page Save button (profile)
        - In-page Save button (job page)
        - Extension popup
        - Options page
        - Export to rolecraft
        - Somewhere else / not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: >
        Errors from the page console, and from the service worker console
        (chrome://extensions → Details → Inspect views). Redact any real names.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed any real people's names, URLs, or photos from this report
          required: true
