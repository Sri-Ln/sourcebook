name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the generated notes can see what changed since the
          # previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tag is the release. If package.json disagrees, the manifest version
      # users see would not match the tag they downloaded — so fail loudly here
      # rather than shipping the mismatch.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $pkg"
            echo "Bump package.json and re-tag."
            exit 1
          fi
          echo "version $pkg"

      # Everything CI runs on a PR, run again here. A release is the one build
      # nobody gets to re-run before it reaches a user.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Package Chrome
        run: npm run zip

      - name: Package Firefox
        run: npm run zip:ff

      - name: Audit manifests
        run: npm run audit

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            .output/*.zip
