name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. This workflow only reads code and uploads artifacts.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs `wxt prepare`, which generates the types tsc needs.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Deliberately never touches live LinkedIn. It is flaky, it would need
      # credentials in CI, and automating a logged-in session is the behaviour
      # that gets accounts restricted. Extraction is covered by fixtures.
      - name: Test
        run: npm test

      - name: Build (Chrome)
        run: npm run build

      # Built from the start so cross-browser breakage surfaces continuously,
      # rather than all at once at Phase 5.
      - name: Build (Firefox)
        run: npm run build:ff

      # Downloadable so a branch can be loaded in a real browser before it is
      # approved. Fixtures prove extraction; only a browser proves the button
      # mounts.
      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
          retention-days: 14

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: firefox-mv2
          path: .output/firefox-mv2
          retention-days: 14
